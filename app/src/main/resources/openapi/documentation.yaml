openapi: 3.0.3
info:
  title: Nobel Prize API
  version: 1.0.0
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    LoginResponse:
      type: object
      properties:
        token: { type: string }
        expiresInSeconds: { type: integer }
    MeResponse:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        role: { type: string }
    PrizeResponse:
      type: object
      properties:
        id: { type: integer }
        awardYear: { type: integer }
        category: { type: string }
        fullName: { type: string, nullable: true }
        motivation: { type: string, nullable: true }
        detailLink: { type: string, nullable: true }
paths:
  /login:
    post:
      summary: Login and get JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401': { description: Invalid credentials }
  /prizes:
    get:
      summary: Get prizes (cached in DB, seeded from Nobel API on first call)
      parameters:
        - in: query
          name: year
          schema: { type: integer }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: List of prizes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrizeResponse'
  /users/me:
    get:
      summary: Current user profile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401': { description: Unauthorized }
  /users/me/prizes:
    get:
      summary: Current user favorites
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Favorite prizes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrizeResponse'
        '401': { description: Unauthorized }
  /users/me/prizes/{prizeId}:
    post:
      summary: Add favorite prize (idempotent)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: prizeId
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Added }
        '401': { description: Unauthorized }
    delete:
      summary: Remove favorite prize
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: prizeId
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Removed }
        '401': { description: Unauthorized }
